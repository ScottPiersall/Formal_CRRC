[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formalcrrc"
version = "0.1.0"
description = "FormalCRRC: counterfactual rubric response curves under programmatically controlled evaluation thresholds"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ANONYMOUS" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
inference = ["torch>=2.1", "transformers>=4.40"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
